[versions]
agp = "8.13.2"
kotlin = "2.2.0"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activity = "1.10.1"
constraintlayout = "2.1.4"
google-maps = "18.1.0"
glide = "4.16.0"
recyclerview = "1.4.0"
retrofit = "2.11.0"
gson = "2.11.0"
okhttp = "4.9.3"
swiperefreshlayout = "1.1.0"
lifecycle = "2.6.2"
